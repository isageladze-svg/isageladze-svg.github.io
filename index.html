    curRef = SURE[v.s - 1] + " Suresi · " + v.a + ". Ayet  (" + v.s + ":" + v.a + ")";
    refEl.textContent = curRef;
    ayetEl.textContent = curText;
    scrollEl.scrollTop = 0;
    mainBtn.textContent = "Yeni Ayet";
    copyBtn.disabled = false; shareBtn.disabled = false;
  }
  function copyText() {
    var s = curText + "\n\n— " + curRef;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s).then(function(){ showToast("Kopyalandı"); }, function(){ fallbackCopy(s); });
    } else { fallbackCopy(s); }
  }
  function fallbackCopy(s) {
    var ta = document.createElement('textarea');
    ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast("Kopyalandı"); } catch (e) {}
    document.body.removeChild(ta);
  }
  mainBtn.addEventListener('click', showRandom);
  copyBtn.addEventListener('click', copyText);
  shareBtn.addEventListener('click', function() {
    var s = curText + "\n\n— " + curRef;
    if (navigator.share) { navigator.share({ text: s }).catch(function(){}); }
    else { copyText(); }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
